<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverso Explorer</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="min-h-dvh bg-slate-100 text-slate-900">

  <!--
    PASO 03 · Tarjeta: capa 2, layout y tipografía
    Qué cambia: Clases de layout en body, main, títulos y en cada elemento de la tarjeta.
    Compruébalo: La tarjeta se ve terminada, pero no responde al mouse ni al teclado.
  -->

  <main class="mx-auto max-w-6xl p-4">
    <h1 class="mt-4 text-3xl font-bold md:text-4xl">Personajes de Rick and Morty</h1>
    <p class="mt-1 text-slate-500">8 de 826 personajes · datos escritos a mano hasta la semana 8</p>

    <h2 class="mt-6 mb-3 text-sm font-semibold tracking-wide text-slate-500 uppercase">Resultados</h2>
    <!-- flex flex-col: hijos uno debajo del otro · overflow-hidden + rounded-2xl: esquinas redondeadas que recortan la imagen
         max-w-xs: TEMPORAL, mientras hay una sola tarjeta. En el paso 5 el ancho lo decide la grilla -->
    <article class="flex flex-col overflow-hidden rounded-2xl bg-white shadow max-w-xs">
      <div class="overflow-hidden">
        <!-- aspect-square: siempre cuadrada · object-cover: rellena sin deformarse (receta de la semana 5) -->
        <img src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" alt="Rick Sanchez"
            class="aspect-square w-full object-cover">
      </div>
      <!-- flex-1: el cuerpo ocupa todo el alto sobrante · gap-2: 8px entre hijos -->
      <div class="flex flex-1 flex-col gap-2 p-4">
        <h3 class="text-lg font-bold text-slate-900">Rick Sanchez</h3>
        <!-- Chip: w-fit para que no ocupe todo el ancho. El color va COMPLETO según el estado (ver el paso 5) -->
        <span class="w-fit rounded-full px-2.5 py-0.5 text-xs font-semibold bg-emerald-100 text-emerald-700">● Vivo</span>
        <p class="text-sm text-slate-500">Human · Earth (C-137)</p>
        <!-- mt-auto: empuja el botón al fondo de la tarjeta -->
        <button type="button" class="mt-auto rounded-lg bg-indigo-600 py-2 font-semibold text-white">
          Ver detalle
        </button>
      </div>
    </article>
  </main>

  <!--
    DATOS PARA EL PASO 5 (GET https://rickandmortyapi.com/api/character/1,2,3,4,5,6,7,8)
    id | name                      | status  | species | origin.name                   | location.name
    1  | Rick Sanchez              | Alive   | Human   | Earth (C-137)                 | Citadel of Ricks
    2  | Morty Smith               | Alive   | Human   | unknown                       | Citadel of Ricks
    3  | Summer Smith              | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    4  | Beth Smith                | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    5  | Jerry Smith               | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    6  | Abadango Cluster Princess | Alive   | Alien   | Abadango                      | Abadango
    7  | Abradolf Lincler          | unknown | Human   | Earth (Replacement Dimension) | Testicle Monster Dimension
    8  | Adjudicator Rick          | Dead    | Human   | unknown                       | Citadel of Ricks
    image: https://rickandmortyapi.com/api/character/avatar/{id}.jpeg
  -->
</body>
</html>
