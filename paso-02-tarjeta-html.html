<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiverso Explorer</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body>

  <!--
    PASO 02 · Tarjeta: capa 1, HTML semántico
    Qué cambia: Estructura de la página (h1, p, h2) y UNA tarjeta sin ninguna clase.
    Compruébalo: Se ve plana: el h3 del mismo tamaño que el texto y el botón sin borde. Es el
    "preflight" de Tailwind: borra los estilos del navegador. Nada se ve bonito hasta que tú lo
    decides.
  -->

  <main>
    <!-- Un solo h1 por página: el título de lo que estás viendo -->
    <h1>Personajes de Rick and Morty</h1>
    <p>8 de 826 personajes · datos escritos a mano hasta la semana 8</p>

    <h2>Resultados</h2>
    <!-- article: una ficha con sentido propio (se entendería sola, fuera de la página) -->
    <article>
      <!-- Este div parece sobrar: en el paso 4 recorta el zoom de la imagen -->
      <div>
        <!-- alt: lo que lee el lector de pantalla y lo que se ve si la imagen no carga -->
        <img src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" alt="Rick Sanchez">
      </div>
      <div>
        <!-- h3: va debajo del h2 "Resultados". No se saltan niveles (semana 2) -->
        <h3>Rick Sanchez</h3>
        <span>● Vivo</span>
        <p>Human · Earth (C-137)</p>
        <!-- button real (no un div ni un <a>): se enfoca con Tab y se activa con Enter -->
        <button type="button">
          Ver detalle
        </button>
      </div>
    </article>
  </main>

  <!--
    DATOS PARA EL PASO 5 (GET https://rickandmortyapi.com/api/character/1,2,3,4,5,6,7,8)
    id | name                      | status  | species | origin.name                   | location.name
    1  | Rick Sanchez              | Alive   | Human   | Earth (C-137)                 | Citadel of Ricks
    2  | Morty Smith               | Alive   | Human   | unknown                       | Citadel of Ricks
    3  | Summer Smith              | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    4  | Beth Smith                | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    5  | Jerry Smith               | Alive   | Human   | Earth (Replacement Dimension) | Earth (Replacement Dimension)
    6  | Abadango Cluster Princess | Alive   | Alien   | Abadango                      | Abadango
    7  | Abradolf Lincler          | unknown | Human   | Earth (Replacement Dimension) | Testicle Monster Dimension
    8  | Adjudicator Rick          | Dead    | Human   | unknown                       | Citadel of Ricks
    image: https://rickandmortyapi.com/api/character/avatar/{id}.jpeg
  -->
</body>
</html>
