<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo · respuesta a un prompt vago</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-gray-100 p-8">

  <!--
    RESPUESTA TÍPICA (representativa, no copiada de una herramienta) al prompt:
      "hazme un modal bonito con tailwind para ver el detalle de un personaje"
    Úsala en la estación 4 si Copilot/Cursor no responde en clase.
    Tiene 6 problemas para encontrar con la lista de chequeo: no los digas, que los cacen.
  -->

  <button onclick="document.getElementById('modal').style.display='flex'"
          class="bg-blue-500 text-white px-4 py-2 rounded">
    Ver personaje
  </button>

  <div id="modal" style="display:none"
       class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center">
    <div class="bg-white rounded-lg shadow-3xl p-6 max-w-8xl w-96">
      <img src="https://rickandmortyapi.com/api/character/avatar/1.jpeg" class="w-full rounded">
      <div class="text-xl font-bold mt-4">Rick Sanchez</div>
      <p class="text-md text-slate-850">Human · Alive</p>
      <p class="text-md text-slate-850">Earth (C-137)</p>
      <div onclick="document.getElementById('modal').style.display='none'"
           class="mt-4 bg-gray-200 text-center py-2 rounded cursor-pointer">
        Cerrar
      </div>
    </div>
  </div>

</body>
</html>
